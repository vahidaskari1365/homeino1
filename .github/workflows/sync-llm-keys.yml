name: "ops: sync LLM keys to Vercel env"
# Task 40 — کلیدهای زنجیره‌ی LLM (سکرت مخزن) را به env ورسل می‌رساند.
# مقادیر هرگز لاگ نمی‌شوند (اسکریپت فقط فراداده چاپ می‌کند).
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Push keys to Vercel (values never logged)
        env:
          LLM_KEYS_JSON: ${{ secrets.LLM_KEYS_JSON }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_kN9XW4YXj4N7xVqy0gcxnPmE1dsQ
        run: node scripts/sync-llm-keys-to-vercel.mjs
      - name: Diagnose Gemini key quotas (model names + status codes only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          LLM_KEYS_JSON: ${{ secrets.LLM_KEYS_JSON }}
        run: node scripts/diagnose-gemini-key.mjs
