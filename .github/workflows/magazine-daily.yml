name: magazine-daily

# به‌روزرسانی «ترندهای روز هومینو» — روزی ۳ نوبت مؤثر (۰۷:۲۰، ۱۲:۵۰، ۱۷:۵۰ تهران)
# هر نوبت تا ۴ بریف ترند (هدف روزانه ۱۲) با چرخش متنوع بین دسته‌های محصول
# (فرش/روشنایی/پرده/تابلو/گلدان/کمد/کف‌پوش/دیوارپوش/مبلمان/دکوری + موضوع‌های عمومی)
# فیدهای نشریات + فیدهای صنفی هر دسته خوانده می‌شوند؛ بریف فارسی بازنویسی‌شده با
# قواعد GEO (جمله اول قابل‌نقل برای گوگل و دستیارهای هوشمند) ساخته و کامیت می‌شود.
# مقاله کامل مجله هم روزی ۱ عدد در نوبت اول تولید می‌شود.
# Secrets: LLM_API_KEY/LLM_BASE_URL/LLM_MODEL یا LLM_KEYS_JSON (سازگار OpenAI)

on:
  schedule:
    - cron: "50 3 * * *"   # ۰۷:۲۰ تهران — نوبت اول (مقاله روز هم همین‌جا)
    - cron: "20 9 * * *"   # ۱۲:۵۰ تهران — نوبت دوم
    - cron: "20 14 * * *"  # ۱۷:۵۰ تهران — نوبت سوم
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: magazine-daily
  cancel-in-progress: true

jobs:
  daily-briefs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate daily trend briefs
        env:
          LLM_KEYS_JSON: ${{ secrets.LLM_KEYS_JSON }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node scripts/magazine-daily.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "homeino-magazine-bot"
          git config user.email "bot@homeino.ir"
          if [[ -n "$(git status --porcelain src/content/trends src/content/magazine public/images/trends src/data/agent-runs)" ]]; then
            git add src/content/trends/trends.json src/content/magazine public/images/trends src/data/agent-runs
            git commit -m "magazine: daily briefs + article (auto)"
            # ایجنت الهام ممکن است هم‌زمان کامیت زده باشد → ری‌بیس و تلاش مجدد
            for i in 1 2 3; do
              if git pull --rebase origin main; then git push && break; fi
              git rebase --abort 2>/dev/null || true
              echo "push retry $i failed — re-pulling"; sleep 15
            done
          else
            echo "No new briefs today — nothing to commit."
          fi
